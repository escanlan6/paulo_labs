built: '2026-09-19'
frozen_through: '2025-12-31'
finance:
  target: Next calendar month's S&P 500 realised volatility, annualised percentage
    points
  realised_volatility: 100 * sqrt(252) * sample SD of daily S&P 500 log returns within
    the month
  predictor: Last available VIX close in the forecast-origin month
  test_period: 2010-01 through 2025-12
  sources:
    sp500: https://finance.yahoo.com/quote/%5EGSPC/history/
    vix: https://cdn-api.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv
uso:
  target: Monthly simple return in percent
  test_period: 2020-01 through 2025-12
  source: https://finance.yahoo.com/quote/USO/history/
insurance:
  rows: 677991
  target: ClaimNb / Exposure; expected count equals Exposure times predicted frequency
  cleaning: 'All supplied rows retained: complete selected fields, positive exposure,
    non-negative counts; no capping'
  split: Seed 109703; 70 percent train and 30 percent test at policy level
  source: https://github.com/dutangc/CASdatasets/blob/master/data/freMTPL2freq.rda
  citation: Dutang and Charpentier (2026), CASdatasets, DOI 10.57745/P0KHAG
